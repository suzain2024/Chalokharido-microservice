server:
  port: 8090

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      default-filters:
        - AuthenticationFilter
      routes:
        - id: user-service-route
          uri: lb://user-service
          predicates:
            - Path=/api/user/**, /api/users/**

        - id: product-service-route
          uri: lb://product-service
          predicates:
            - Path=/api/product/**

        - id: order-service-route
          uri: lb://order-service
          predicates:
            - Path=/api/order/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

