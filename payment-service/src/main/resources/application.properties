spring.application.name=payment-service
server.port=8084

# In-Memory Database (H2)
# FROM THIS (H2 in-memory):
# spring.datasource.url=jdbc:h2:mem:testdb
# spring.datasource.driverClassName=org.h2.Driver

# TO THIS (PostgreSQL):
spring.datasource.url=jdbc:postgresql://localhost:5432/payment_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# ==========================================
# Apache Kafka Configuration
# ==========================================
spring.kafka.bootstrap-servers=localhost:9092

# Producer Configuration (Produces to payment-events-topic)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=true
spring.kafka.producer.properties.spring.json.type.mapping=orderPlaced:com.example.payment_service.kafka.OrderPlacedEvent,paymentSuccess:com.example.payment_service.kafka.PaymentSuccessEvent,paymentFailure:com.example.payment_service.kafka.PaymentFailureEvent

# Consumer Configuration (Listens to order-events-topic)
spring.kafka.consumer.group-id=payment-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.type.mapping=orderPlaced:com.example.payment_service.kafka.OrderPlacedEvent,paymentSuccess:com.example.payment_service.kafka.PaymentSuccessEvent,paymentFailure:com.example.payment_service.kafka.PaymentFailureEvent